server:
  port: 0

spring:
  application:
    name: ssp-comment-center-test
  shardingsphere:
    datasource:
      names: ds_0, ds_1
      ds_0:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/ssp_comment_0?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
        username: root
        password: root
        hikari:
          maximum-pool-size: 5
          minimum-idle: 1
          connection-timeout: 30000
      ds_1:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        jdbc-url: jdbc:mysql://localhost:3306/ssp_comment_1?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
        username: root
        password: root
        hikari:
          maximum-pool-size: 5
          minimum-idle: 1
          connection-timeout: 30000
    rules:
      sharding:
        tables:
          component_comment:
            actualDataNodes: ds_${0..1}.component_comment_${0..3}
            databaseStrategy:
              standard:
                shardingColumn: comment_object_id
                shardingAlgorithmName: comment-db-inline
            tableStrategy:
              standard:
                shardingColumn: comment_object_id
                shardingAlgorithmName: comment-table-inline
          component_comment_reply:
            actualDataNodes: ds_${0..1}.component_comment_reply_${0..3}
            databaseStrategy:
              standard:
                shardingColumn: comment_id
                shardingAlgorithmName: reply-db-inline
            tableStrategy:
              standard:
                shardingColumn: comment_id
                shardingAlgorithmName: reply-table-inline
          component_comment_like:
            actualDataNodes: ds_${0..1}.component_comment_like_${0..3}
            databaseStrategy:
              standard:
                shardingColumn: user_id
                shardingAlgorithmName: like-db-inline
            tableStrategy:
              standard:
                shardingColumn: user_id
                shardingAlgorithmName: like-table-inline
          component_user_comment_index:
            actualDataNodes: ds_${0..1}.component_user_comment_index_${0..3}
            databaseStrategy:
              standard:
                shardingColumn: user_id
                shardingAlgorithmName: index-db-inline
            tableStrategy:
              standard:
                shardingColumn: user_id
                shardingAlgorithmName: index-table-inline
          component_notification:
            actualDataNodes: ds_${0..1}.component_notification_${0..3}
            databaseStrategy:
              standard:
                shardingColumn: user_id
                shardingAlgorithmName: notification-db-inline
            tableStrategy:
              standard:
                shardingColumn: user_id
                shardingAlgorithmName: notification-table-inline
        shardingAlgorithms:
          comment-db-inline:
            type: INLINE
            props:
              algorithm-expression: ds_${comment_object_id % 2}
          comment-table-inline:
            type: INLINE
            props:
              algorithm-expression: component_comment_${comment_object_id % 4}
          reply-db-inline:
            type: INLINE
            props:
              algorithm-expression: ds_${comment_id % 2}
          reply-table-inline:
            type: INLINE
            props:
              algorithm-expression: component_comment_reply_${comment_id % 4}
          like-db-inline:
            type: INLINE
            props:
              algorithm-expression: ds_${user_id % 2}
          like-table-inline:
            type: INLINE
            props:
              algorithm-expression: component_comment_like_${user_id % 4}
          index-db-inline:
            type: INLINE
            props:
              algorithm-expression: ds_${user_id % 2}
          index-table-inline:
            type: INLINE
            props:
              algorithm-expression: component_user_comment_index_${user_id % 4}
          notification-db-inline:
            type: INLINE
            props:
              algorithm-expression: ds_${user_id % 2}
          notification-table-inline:
            type: INLINE
            props:
              algorithm-expression: component_notification_${user_id % 4}
    props:
      sql-show: true
  redis:
    host: localhost
    port: 6379
    password:
    database: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ssp.comment.dao.pojo
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.ssp.comment.dao.mapper: debug
    org.apache.shardingsphere: debug
